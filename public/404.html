  <style>
    :root{background:#090807;color:#d9d2c0;font-family:Courier New,monospace}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#090807}body{display:grid;place-items:center;padding:24px}.wrap{width:min(860px,100%);border:1px solid #3a3329;padding:28px;box-shadow:0 0 0 1px #17130f inset;background:linear-gradient(180deg,#0d0b09,#080706)}.top{display:flex;justify-content:space-between;gap:16px;font-size:12px;text-transform:uppercase;border-bottom:1px solid #342d25;padding-bottom:10px;color:#8e8779}.code{font-family:Arial Black,Arial,sans-serif;font-size:clamp(4rem,15vw,10rem);letter-spacing:-.06em;line-height:.85;margin:48px 0 24px;color:#e7deca}.headline{font-family:Georgia,serif;font-size:clamp(2rem,5vw,4.2rem);margin:0 0 18px}.copy{font-size:clamp(1rem,1.6vw,1.25rem);line-height:1.65;max-width:680px;color:#aaa394}.blood{color:#8b1616}.back{display:inline-block;margin-top:32px;padding:12px 18px;border:1px solid #5a1818;color:#e7deca;text-decoration:none;transition:.2s}.back:hover{background:#8b1616;color:#0a0807}.noise{margin-top:40px;border-top:1px dashed #332b24;padding-top:12px;font-size:12px;color:#655d53;line-height:1.7}
  </style>
</head>
<body>
  <main class="wrap">

</body>
</html>
